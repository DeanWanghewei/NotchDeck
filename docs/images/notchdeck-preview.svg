<title id="title">NotchDeck 信息岛：悬浮模式与刘海接壤模式效果示意</title>
<desc id="description">左侧为浅色悬浮面板，展示媒体、音量和系统监控；右侧为与刘海连接的深色面板，展示媒体、音量和进程监控。底部介绍悬停刘海、Command Shift I 快捷键、菜单栏图标三种唤起方式。所有数据均为示例。</desc>
