name: NotchDeck
options:
  bundleIdPrefix: com.notchdeck
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  NotchDeck:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Modules
      - path: UI
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchdeck.app
        PRODUCT_NAME: NotchDeck
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: NotchDeck
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "NotchDeck 通过自动化读取并控制音乐播放（Music / Spotify）。"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  NotchDeckTests:
    type: bundle.unit-test
    platform: macOS
    # 无宿主逻辑测试：复用产品源码，不启动菜单栏 App 或读取用户的媒体源。
    sources:
      - path: Core
      - path: Modules
      - path: UI
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
schemes:
  NotchDeck:
    build:
      targets:
        NotchDeck: all
    test:
      targets:
        - NotchDeckTests
