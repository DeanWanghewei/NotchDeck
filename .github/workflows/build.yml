name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 测试与构建（macOS arm64）
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          sw_vers
          xcodebuild -version

      # .xcodeproj 不入库（.gitignore 忽略 *.xcodeproj），由 project.yml 在 CI 现场生成
      - name: 安装 xcodegen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 运行测试
        run: |
          set -o pipefail
          xcodebuild -project NotchDeck.xcodeproj -scheme NotchDeck test 2>&1 | grep -E "Test Suite|Test Case.*(passed|failed)|error:|TEST" | tail -60

      - name: Release 构建
        run: |
          xcodebuild -project NotchDeck.xcodeproj -scheme NotchDeck \
            -configuration Release -derivedDataPath build/ci -quiet

      - name: 打包 app 与 dmg
        id: package
        run: |
          APP="build/ci/Build/Products/Release/NotchDeck.app"
          test -d "$APP" || { echo "未找到 $APP"; ls -R build/ci/Build/Products | head -20; exit 1; }
          # 版本号以 project.yml 为源头，避免依赖生成的 Info.plist 键
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' project.yml | head -1)
          test -n "$VERSION" || { echo "未解析到版本号"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "NotchDeck-v${VERSION}-arm64.zip"
          hdiutil create -volname NotchDeck -srcfolder "$APP" -ov -format UDZO \
            "NotchDeck-v${VERSION}-arm64.dmg"
          ls -lh NotchDeck-v*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NotchDeck-v${{ steps.package.outputs.version }}-arm64
          path: |
            NotchDeck-v*-arm64.zip
            NotchDeck-v*-arm64.dmg
          if-no-files-found: error

      # 发版流程：推 v* 标签即发布 Release；说明取自标签注释（git tag -a -F），无注释时自动生成
      - name: 发布 GitHub Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION='${{ steps.package.outputs.version }}'
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "标签 $TAG 与 project.yml 版本 $VERSION 不一致"; exit 1
          fi
          # 浅克隆可能只取到剥离的标签引用，显式拉取标签对象保证能读到注释
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          ARGS=(--title "NotchDeck $TAG")
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -n "$NOTES" ]; then ARGS+=(--notes "$NOTES"); else ARGS+=(--generate-notes); fi
          gh release create "$TAG" "${ARGS[@]}" "NotchDeck-v${VERSION}-arm64.dmg" ||
            gh release upload "$TAG" "NotchDeck-v${VERSION}-arm64.dmg" --clobber
